<!doctype html>
<html><head><meta charset="utf-8"><title>mockup compositor</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="out"></canvas>
<script type="module">
// Puts the real logo SVG onto a product photo. The logo is warped with a fine
// mesh (perspective quad or cylinder), then shaded by the photo itself so folds
// and light run through the print. Driven by render via window.compose(spec).
const loadImg = src => new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = src; });

// Homography from the unit square to quad p (tl, tr, br, bl).
function squareToQuad(p) {
  const [[x0, y0], [x1, y1], [x2, y2], [x3, y3]] = p;
  const dx1 = x1 - x2, dx2 = x3 - x2, dy1 = y1 - y2, dy2 = y3 - y2;
  const sx = x0 - x1 + x2 - x3, sy = y0 - y1 + y2 - y3;
  const den = dx1 * dy2 - dx2 * dy1;
  const g = (sx * dy2 - dx2 * sy) / den, h = (dx1 * sy - sx * dy1) / den;
  const a = x1 - x0 + g * x1, b = x3 - x0 + h * x3, c = x0;
  const d = y1 - y0 + g * y1, e = y3 - y0 + h * y3, f = y0;
  return (u, v) => { const w = g * u + h * v + 1; return [(a * u + b * v + c) / w, (d * u + e * v + f) / w]; };
}
// A label wrapped round a vertical cylinder seen from the front.
// r2 tapers the radius toward the bottom (paper cups).
function cylinder({ cx, r, r2 = r, top, bottom, arc = 1.6, sag = 0 }) {
  return (u, v) => {
    const th = (u - 0.5) * arc;
    const x = cx + (r + (r2 - r) * v) * Math.sin(th);
    const y = top + (bottom - top) * v + sag * (1 - Math.cos(th));
    return [x, y];
  };
}

// Draw src (w×h) onto ctx through mapping fn using an N×N mesh of affine triangles.
function meshDraw(ctx, src, fn, N = 40) {
  const w = src.width, h = src.height;
  const tri = (s0, s1, s2, d0, d1, d2) => {
    ctx.save();
    ctx.beginPath();
    // Expand the triangle a hair so neighbours overlap and no seams show.
    const cxm = (d0[0] + d1[0] + d2[0]) / 3, cym = (d0[1] + d1[1] + d2[1]) / 3;
    const grow = p => {
      const dx = p[0] - cxm, dy = p[1] - cym, l = Math.hypot(dx, dy) || 1;
      return [p[0] + (dx / l) * 1.2, p[1] + (dy / l) * 1.2];
    };
    const [e0, e1, e2] = [grow(d0), grow(d1), grow(d2)];
    ctx.moveTo(...e0); ctx.lineTo(...e1); ctx.lineTo(...e2); ctx.closePath(); ctx.clip();
    // Solve the affine map from source triangle to destination triangle.
    const [sx0, sy0] = s0, [sx1, sy1] = s1, [sx2, sy2] = s2;
    const det = sx0 * (sy1 - sy2) + sx1 * (sy2 - sy0) + sx2 * (sy0 - sy1);
    const A = (d0[0] * (sy1 - sy2) + d1[0] * (sy2 - sy0) + d2[0] * (sy0 - sy1)) / det;
    const B = (d0[1] * (sy1 - sy2) + d1[1] * (sy2 - sy0) + d2[1] * (sy0 - sy1)) / det;
    const C = (d0[0] * (sx2 - sx1) + d1[0] * (sx0 - sx2) + d2[0] * (sx1 - sx0)) / det;
    const D = (d0[1] * (sx2 - sx1) + d1[1] * (sx0 - sx2) + d2[1] * (sx1 - sx0)) / det;
    const E = (d0[0] * (sx1 * sy2 - sx2 * sy1) + d1[0] * (sx2 * sy0 - sx0 * sy2) + d2[0] * (sx0 * sy1 - sx1 * sy0)) / det;
    const F = (d0[1] * (sx1 * sy2 - sx2 * sy1) + d1[1] * (sx2 * sy0 - sx0 * sy2) + d2[1] * (sx0 * sy1 - sx1 * sy0)) / det;
    ctx.setTransform(A, B, C, D, E, F);
    ctx.drawImage(src, 0, 0);
    ctx.restore();
  };
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const u0 = i / N, u1 = (i + 1) / N, v0 = j / N, v1 = (j + 1) / N;
    const S = (u, v) => [u * w, v * h];
    const p00 = fn(u0, v0), p10 = fn(u1, v0), p11 = fn(u1, v1), p01 = fn(u0, v1);
    tri(S(u0, v0), S(u1, v0), S(u1, v1), p00, p10, p11);
    tri(S(u0, v0), S(u1, v1), S(u0, v1), p00, p11, p01);
  }
}

window.compose = async spec => {
  const base = await loadImg(spec.base);
  const W = base.naturalWidth, H = base.naturalHeight;
  const out = document.getElementById('out');
  out.width = W; out.height = H;
  const ctx = out.getContext('2d');
  ctx.drawImage(base, 0, 0);

  // Logo rasterised large and flat; its aspect ratio decides the mesh source.
  const logo = await loadImg(spec.logo);
  const lw = 2400, lh = Math.round((lw * logo.naturalHeight) / logo.naturalWidth);
  const flat = new OffscreenCanvas(lw, lh);
  flat.getContext('2d').drawImage(logo, 0, 0, lw, lh);

  const fn = spec.quad ? squareToQuad(spec.quad) : cylinder(spec.cylinder);
  const mask = new OffscreenCanvas(W, H);
  const mctx = mask.getContext('2d');
  mctx.imageSmoothingQuality = 'high';
  // Two passes: anti-aliased triangle edges leave faint seams that a second pass fills.
  meshDraw(mctx, flat, fn);
  meshDraw(mctx, flat, fn);

  // Shade the ink with the photo: local brightness relative to the print area's mean.
  const b = ctx.getImageData(0, 0, W, H), m = mctx.getImageData(0, 0, W, H);
  const lum = i => 0.2126 * b.data[i] + 0.7152 * b.data[i + 1] + 0.0722 * b.data[i + 2];
  let sum = 0, n = 0;
  for (let i = 0; i < m.data.length; i += 4) if (m.data[i + 3] > 128) { sum += lum(i); n++; }
  const mean = Math.max(1, sum / Math.max(1, n));
  const ink = spec.ink === 'white' ? [244, 242, 238] : [18, 18, 18];
  const op = spec.opacity ?? 0.94;
  for (let i = 0; i < m.data.length; i += 4) {
    const a = (m.data[i + 3] / 255) * op;
    if (!a) continue;
    // On dark cloth the weave is mostly noise, so white ink takes only a little of it;
    // dark ink on light surfaces keeps more of the folds and light.
    const rel = lum(i) / mean;
    const shade = spec.ink === 'white'
      ? Math.min(1.08, Math.max(0.78, 1 + (rel - 1) * 0.18))
      : Math.min(1.35, Math.max(0.45, rel));
    for (let c = 0; c < 3; c++) {
      const target = spec.ink === 'white' ? ink[c] * shade : Math.min(255, ink[c] + b.data[i + c] * 0.06) * shade;
      b.data[i + c] = b.data[i + c] * (1 - a) + target * a;
    }
  }
  ctx.putImageData(b, 0, 0);
  if (spec.crop) {
    const [x, y, w, h] = spec.crop;
    const cut = ctx.getImageData(x, y, w, h);
    out.width = w; out.height = h;
    ctx.putImageData(cut, 0, 0);
  }
  return [out.width, out.height];
};
window.READY = true;
</script></body></html>
