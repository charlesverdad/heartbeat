# Heartbeat Screens: test, build and deploy brand/screens to Cloudflare Pages.
# Pushes to main deploy to production; pull requests get a preview URL.
# The Pages project itself (and its domain) is created by terraform/screens.
name: screens

on:
  push:
    branches: [main]
    paths: [brand/screens/**, .github/workflows/screens.yml]
  pull_request:
    paths: [brand/screens/**, .github/workflows/screens.yml]
  workflow_dispatch:

concurrency:
  group: screens-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brand/screens
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The build and tests use only Node built-ins, so no npm install
      # (puppeteer-core is for the local screenshot check only).
      - run: npm test
      - run: npm run build
      # Branch names are attacker-shaped text: keep only safe characters before they reach the
      # deploy command (Pages turns the branch into a preview subdomain anyway).
      - name: Branch alias
        id: branch
        env:
          RAW: ${{ github.head_ref || github.ref_name }}
        run: echo "name=$(printf '%s' "$RAW" | tr -c 'A-Za-z0-9-' '-' | cut -c1-60)" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages
        id: deploy
        # Forked PRs get no secrets, so they build and test but skip the deploy.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: brand/screens
          command: pages deploy dist --project-name=screens --branch=${{ steps.branch.outputs.name }}
      - name: Summary
        if: steps.deploy.outcome == 'success'
        run: echo "Deployed ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
